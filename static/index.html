<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Capture Inbox</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0e0f11; color: #e8e9ea;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 2rem 1rem 4rem; touch-action: manipulation;
  }
  h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .04em; opacity: .85; }
  #btn {
    margin-top: 6vh; width: 180px; height: 180px; border-radius: 50%;
    background: #1b1d20; color: #e8e9ea; border: 1px solid #2a2d31;
    font-size: 1rem; letter-spacing: .06em; user-select: none;
    -webkit-user-select: none; touch-action: none; cursor: pointer;
    transition: background .15s, transform .1s;
  }
  #btn.rec {
    background: #d43f3f; border-color: #ff6b6b; transform: scale(1.06);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(212,63,63,.5); }
    50% { box-shadow: 0 0 0 22px rgba(212,63,63,0); }
  }
  #hint { margin-top: 1.2rem; opacity: .55; font-size: .85rem; }
  #list { margin-top: 3rem; width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: .6rem; }
  .card {
    background: #17181b; border: 1px solid #24262a; border-radius: 10px;
    padding: .8rem 1rem; display: flex; flex-direction: column; gap: .35rem;
  }
  .meta { display: flex; gap: .6rem; align-items: center; font-size: .72rem; }
  .label {
    font-family: ui-monospace, monospace; font-size: .68rem; padding: .12rem .5rem;
    border-radius: 99px; border: 1px solid; letter-spacing: .05em; text-transform: uppercase;
  }
  .label-idea  { color: #7ab8ff; border-color: #2c4a6e; }
  .label-task  { color: #7fd492; border-color: #2e5c3a; }
  .label-lead  { color: #e3b566; border-color: #6e5326; }
  .label-noise { color: #9a9a9a; border-color: #3a3a3a; }
  .label-none  { color: #c77; border-color: #5c3434; }
  .time { opacity: .45; }
  .note { font-size: .75rem; color: #c79a5a; }
  p.text { font-size: .95rem; line-height: 1.45; }
  #err { color: #ff8080; margin-top: 1rem; font-size: .85rem; min-height: 1.2em; }
</style>
</head>
<body>
  <h1>VOICE CAPTURE INBOX</h1>
  <button id="btn" aria-label="Hold to record">HOLD TO TALK</button>
  <div id="hint">press and hold — release to send</div>
  <div id="err" role="alert"></div>
  <div id="list" aria-live="polite"></div>

<script>
(() => {
  const btn = document.getElementById('btn');
  const hint = document.getElementById('hint');
  const err = document.getElementById('err');
  const list = document.getElementById('list');

  let recorder = null;
  let chunks = [];
  let active = false;

  async function start() {
    err.textContent = '';
    if (active) return;
    active = true;
    btn.classList.add('rec');
    btn.textContent = 'RECORDING';
    hint.textContent = 'release to send';
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recorder = new MediaRecorder(stream);
      chunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        if (blob.size > 0) upload(blob);
      };
      recorder.start();
    } catch (e) {
      cleanup();
      err.textContent = 'microphone unavailable — check permissions';
    }
  }

  function stop() {
    if (!active) return;
    active = false;
    btn.classList.remove('rec');
    btn.textContent = 'HOLD TO TALK';
    hint.textContent = 'press and hold — release to send';
    if (recorder && recorder.state === 'recording') {
      recorder.stop();
    }
  }

  function cleanup() {
    active = false;
    btn.classList.remove('rec');
    btn.textContent = 'HOLD TO TALK';
  }

  async function upload(blob) {
    const fd = new FormData();
    fd.append('file', blob, 'capture.webm');
    try {
      const res = await fetch('/api/captures', { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'upload failed');
      renderCard(data);
    } catch (e) {
      err.textContent = e.message;
    }
  }
  // exposed for the e2e test: lets it drive the page's real upload path
  window.__upload = upload;

  function renderCard(data) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = data.id;
    const cls = data.class || 'none';
    const label = document.createElement('span');
    label.className = `label label-${cls}`;
    label.textContent = data.status === 'unprocessed' && !data.class ? 'unprocessed' : cls;
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = (data.created_at || '').replace('T', ' ').replace('+00:00', ' UTC');
    const meta = document.createElement('div');
    meta.className = 'label-row meta';
    meta.append(label, time);
    const text = document.createElement('p');
    text.className = 'text';
    text.textContent = data.transcript || '(no transcript)';
    card.append(meta, text);
    if (data.note) {
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = data.note;
      card.append(note);
    }
    list.prepend(card);
  }

  btn.addEventListener('pointerdown', (e) => { e.preventDefault(); start(); });
  btn.addEventListener('pointerup', () => stop());
  btn.addEventListener('pointercancel', () => stop());
  btn.addEventListener('lostpointercapture', () => stop());
  // keyboard fallback: hold space
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat && document.activeElement === document.body) start();
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') stop();
  });

  // load existing captures
  fetch('/api/captures?limit=20')
    .then((r) => r.json())
    .then((rows) => rows.forEach(renderCard))
    .catch(() => {});
})();
</script>
</body>
</html>
